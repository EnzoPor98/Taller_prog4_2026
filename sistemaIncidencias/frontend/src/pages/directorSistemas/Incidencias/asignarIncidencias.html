<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de incidencias</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
  <link rel="stylesheet" href="/src/pages/directorSistemas/director.css" />
</head>

<body>
  <header>
    <div id="navbar-placeholder"></div>
  </header>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Gestión de incidencias</h1>
        <p class="text-body-secondary mb-0">Asigná las incidencias a un empleado de sistemas o cancelá las pendientes.</p>
      </div>
      <span id="contador" class="text-body-secondary small"></span>
    </div>

    <div id="alertas" aria-live="polite"></div>

    <section class="tarjeta-panel mb-3" aria-label="Filtros">
      <div class="row g-2">
        <div class="col-12 col-md-4">
          <label for="filtro-estado" class="form-label small mb-1">Estado</label>
          <select id="filtro-estado" class="form-select">
            <option value="">Todos</option>
            <option value="1">Pendiente</option>
            <option value="2">En Proceso</option>
            <option value="3">Resuelta</option>
            <option value="4">Cancelada</option>
          </select>
        </div>
        <div class="col-12 col-md-8">
          <label for="filtro-texto" class="form-label small mb-1">Buscar</label>
          <input type="search" id="filtro-texto" class="form-control"
            placeholder="Número, artículo, pedido o creador" />
        </div>
      </div>
    </section>

    <section class="tarjeta-panel">
      <div class="table-responsive">
        <table class="table table-sm table-hover tabla-incidencias mb-0">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col" class="d-none d-xl-table-cell">Fecha</th>
              <th scope="col">Artículo</th>
              <th scope="col" class="d-none d-md-table-cell">Pedido</th>
              <th scope="col" class="d-none d-xl-table-cell">Creador</th>
              <th scope="col">Prioridad</th>
              <th scope="col">Estado</th>
              <th scope="col" class="d-none d-md-table-cell">Asignado a</th>
              <th scope="col" class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-incidencias">
            <tr>
              <td colspan="9" class="text-center text-body-secondary py-4">Cargando incidencias…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Modal: asignar incidencia -->
  <div class="modal fade" id="modal-asignar" tabindex="-1" aria-labelledby="modal-asignar-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="form-asignar" novalidate>
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modal-asignar-titulo">Asignar incidencia</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="fw-semibold mb-1" id="asignar-resumen"></p>
          <p class="small text-body-secondary" id="asignar-pedido"></p>
          <label for="asignar-tecnico" class="form-label">Empleado de sistemas</label>
          <select id="asignar-tecnico" class="form-select" required></select>
          <div id="asignar-error" class="text-danger small mt-2" role="alert"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-primary" id="asignar-confirmar">Asignar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/components/navbar/navbar.js"></script>
  <script type="module" src="/src/components/footer/footer.js"></script>
  <script type="module" src="./asignarIncidencias.js"></script>
</body>

</html>
