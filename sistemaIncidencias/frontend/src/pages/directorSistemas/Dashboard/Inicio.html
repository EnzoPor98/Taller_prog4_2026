<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg custom-navbar" data-bs-theme="dark">
            <div class="container-fluid">
                <img class="logo" src="/src/assets/logoMunicipalidad.png" alt="Logo Municipalidad" />
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link" href="#">INICIO</a>
                        <a class="nav-link" href="#">ARTICULOS</a>
                        <a class="nav-link" href="#">INCIDENCIAS</a>
                    </div>
                </div>
                <!-- Perfil de usuario: reemplaza al navbar-toggler de Bootstrap -->
                <div class="user-profile-toggle" role="button" tabindex="0" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Abrir menú / perfil">
                    <div class="user-info">
                        <span class="user-name">Nombre Apellido</span>
                        <span class="user-role">Rol del usuario</span>
                    </div>
                    <div class="user-avatar"></div>
                </div>
            </div>
        </nav>
    </header>

    <h3 class="display-2 text-center">Card colors</h3>
    <div class="row justify-content-center">
        <div class="col-md-3">
            <div class="card bg-info text-black">
                <div class="card-header fw-bold text-center">TOTAL INCIDENCIAS POR ESTADO</div>
                <div class="card-body">
                    <h1 class="card-title text-center">GRAFICO TORTA</h1>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-info text-black">
                <div class="card-header fw-bold text-center">TOTAL INCIDENCIAS SEGUN FECHAS</div>
                <div class="card-body">
                    <h1 class="card-title text-center">FILTRO</h1>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-info text-black">
                <div class="card-header fw-bold text-center">TOTAL INCIDENCIAS PRIORITARIAS</div>
                <div class="card-body">
                    <h1 class="card-title text-center">5</h1>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.min.js"
        integrity="sha384-+YQ4JLhjyBLPDQt//I+STsc9iw4uQqACwlvpslubQzn4u2UU2UFM80nGisd026JF" crossorigin="anonymous">
        </script>
    <script src="/src/components/navbar/navbar.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
