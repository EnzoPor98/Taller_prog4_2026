<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Director de Sistemas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <link rel="stylesheet" href="/src/pages/directorSistemas/director.css" />
</head>

<body>
    <header>
        <div id="navbar-placeholder"></div>
    </header>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
            <div>
                <h1 class="h3 mb-1">Panel de incidencias</h1>
                <p class="text-body-secondary mb-0">Resumen general del estado de las incidencias.</p>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-primary" href="/src/pages/directorSistemas/Reportes/Reportes.html">
                    <i class="bi bi-file-earmark-pdf me-1" aria-hidden="true"></i>Reporte PDF
                </a>
                <a class="btn btn-primary" href="/src/pages/directorSistemas/Incidencias/asignarIncidencias.html">
                    <i class="bi bi-list-check me-1" aria-hidden="true"></i>Gestionar incidencias
                </a>
            </div>
        </div>

        <div id="alertas" aria-live="polite"></div>

        <!-- Totales por estado (se completan desde /incidencias/datos-dashboard) -->
        <section class="row g-3 mb-3" aria-label="Totales por estado">
            <div class="col-6 col-lg-3">
                <div class="tarjeta-panel border-start border-4 border-warning">
                    <p class="text-body-secondary small mb-1">Pendientes</p>
                    <p class="h2 mb-0" id="total-pendientes">-</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="tarjeta-panel border-start border-4 border-primary">
                    <p class="text-body-secondary small mb-1">En proceso</p>
                    <p class="h2 mb-0" id="total-en-proceso">-</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="tarjeta-panel border-start border-4 border-success">
                    <p class="text-body-secondary small mb-1">Resueltas</p>
                    <p class="h2 mb-0" id="total-resueltas">-</p>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="tarjeta-panel border-start border-4 border-secondary">
                    <p class="text-body-secondary small mb-1">Canceladas</p>
                    <p class="h2 mb-0" id="total-canceladas">-</p>
                </div>
            </div>
        </section>

        <section class="row g-3">
            <!-- Grafico por estado -->
            <div class="col-12 col-lg-5">
                <div class="tarjeta-panel h-100">
                    <h2 class="h6">Incidencias por estado</h2>
                    <div class="contenedor-grafico">
                        <canvas id="grafico-estados" aria-label="Gráfico de incidencias por estado" role="img"></canvas>
                    </div>
                </div>
            </div>

            <!-- Grafico por fecha con filtro -->
            <div class="col-12 col-lg-7">
                <div class="tarjeta-panel h-100">
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-2">
                        <h2 class="h6 mb-0">Incidencias por fecha</h2>
                        <form id="form-fechas" class="d-flex flex-wrap gap-2 align-items-end">
                            <div>
                                <label for="fecha-desde" class="form-label small mb-0">Desde</label>
                                <input type="date" id="fecha-desde" class="form-control form-control-sm" />
                            </div>
                            <div>
                                <label for="fecha-hasta" class="form-label small mb-0">Hasta</label>
                                <input type="date" id="fecha-hasta" class="form-control form-control-sm" />
                            </div>
                            <button type="submit" class="btn btn-sm btn-outline-primary">Filtrar</button>
                        </form>
                    </div>
                    <div class="contenedor-grafico">
                        <canvas id="grafico-fechas" aria-label="Gráfico de incidencias por fecha" role="img"></canvas>
                    </div>
                    <p class="small text-body-secondary mb-0 mt-2" id="resumen-fechas"></p>
                </div>
            </div>

            <!-- Incidencias prioritarias -->
            <div class="col-12">
                <div class="tarjeta-panel">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h2 class="h6 mb-0">
                            Incidencias prioritarias
                            <span class="badge text-bg-danger ms-1" id="total-prioritarias">-</span>
                        </h2>
                    </div>
                    <ul class="list-group list-group-flush" id="lista-prioritarias">
                        <li class="list-group-item text-body-secondary">Cargando…</li>
                    </ul>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/components/navbar/navbar.js"></script>
    <script type="module" src="/src/components/footer/footer.js"></script>
    <script type="module" src="./Inicio.js"></script>
</body>

</html>
