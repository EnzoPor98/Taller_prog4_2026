<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <meta charset="UTF-8">
    <title>Incidencias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div id="navbar-placeholder"></div>
    <div class="container mt-4">
        <div class="row">
            <div class="col m-2 d-flex justify-content-start">
                <button type="button" class="btn btn-primary" onclick="goToMenu()">
                    Volver
                </button>
            </div>
            <div class="col d-flex justify-content-center align-items-center">
                <h1>Incidencias</h1>
            </div>
            <div class="col m-2 d-flex justify-content-end">
                <!-- <button type="button" class="btn btn-primary" onclick="abrirModalCrear()">
                    Crear incidencia
                </button> -->
            </div>
        </div>




        <div class="alert alert-primary" role="alert">
            Gestiona las incidencias asignadas a tu cargo.
        </div>
        <!-- Tabla de datos -->
        <table class="table table-sm table-striped">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Prioridad</th>
                    <th scope="col">Desc</th>
                    <th scope="col">Creador</th>
                    <th scope="col">Responsable</th>
                    <th scope="col">Fecha</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Acciones</th>

                </tr>
            </thead>
            <tbody id="incidencias-tbody">

            </tbody>
        </table>
    </div>
    </div>
    <!-- Modal Ver Incidencia -->
    <div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewModalTitle">Detalle de Incidencia #</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Prioridad</dt>
                        <dd class="col-sm-8">
                            <span id="view-prioridad-badge" class="badge">-</span>
                        </dd>

                        <dt class="col-sm-4">Estado</dt>
                        <dd class="col-sm-8" id="view-estado">-</dd>

                        <dt class="col-sm-4">Descripción del pedido</dt>
                        <dd class="col-sm-8" id="view-descripcion-pedido">-</dd>

                        <dt class="col-sm-4">Descripción de resolución</dt>
                        <dd class="col-sm-8" id="view-descripcion-resolucion">-</dd>

                        <dt class="col-sm-4">Artículo</dt>
                        <dd class="col-sm-8" id="view-articulo">-</dd>

                        <dt class="col-sm-4">Creador</dt>
                        <dd class="col-sm-8" id="view-creador">-</dd>

                        <dt class="col-sm-4">Asignado a</dt>
                        <dd class="col-sm-8" id="view-asignado">-</dd>

                        <dt class="col-sm-4">Creado</dt>
                        <dd class="col-sm-8" id="view-creado">-</dd>
                    </dl>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script src="/src/components/navbar/navbar.js" defer></script>
    <script src="/src/pages/empleadoSistemas/incidencias/incidencias.js" defer></script>
</body>

</html>
