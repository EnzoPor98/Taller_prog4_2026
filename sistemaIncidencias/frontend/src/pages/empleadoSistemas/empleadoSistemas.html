<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <link rel="stylesheet" href="./empleadoSistemas.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Incidencias</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <main class="flex-grow-1">

        <!-- Inyeccion de navbar -->
        <div id="navbar-placeholder"></div>
        <div class="container py-4">
            <div class="row g-4">
                <!-- Categorias -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <h5 class="card-title fw-bold">Categorias</h5>
                            <p class="card-text text-muted">Gestiona las categorías del catálogo: alta, edición y baja
                                de registros.</p>
                        </div>
                        <button type="button" data-seccion="categorias" class="btn btn-primary botones">Gestionar
                            categorías</button>

                    </div>
                </div>
                <!-- Articulos -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <h5 class="card-title fw-bold">Articulos</h5>
                            <p class="card-text text-muted">Gestiona los artículos del catálogo: alta, edición y baja de
                                registros.</p>
                        </div>
                        <button type="button" data-seccion="articulos" class="btn btn-primary botones">Gestionar
                            artículos</button>
                    </div>
                </div>
                <!-- Incidencias -->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <h5 class="card-title fw-bold">Incidencias</h5>
                            <p class="card-text text-muted">Gestiona las incidencias del sistema: registro, seguimiento
                                y cierre.</p>
                        </div>
                        <button type="button" data-seccion="incidencias" class="btn btn-primary botones">Ver
                            incidencias</button>
                    </div>
                </div>
            </div>
        </div>

    </main>
    <div class="mt-auto" id="footer-placeholder"></div>
    <!-- <footer >
    </footer> -->
    <script type="module" src="/src/main.js"></script>
    <script src="/src/components/navbar/navbar.js" defer></script>
    <script src="/src/components/footer/footer.js" defer></script>
    <script src="/src/pages/empleadoSistemas/empleadoSistemas.js" defer></script>
</body>

</html>
