<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articulos</title>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <div class="container mt-4">
        <h1>Articulos</h1>
        <div class="alert alert-primary" role="alert">
            Lista de Articulos del catálogo. Aquí puedes dar de alta, baja y modificar los articulos.
            <button type="button" class="btn btn-primary" onclick="abrirModalCrear()">Crear Articulo</button>
        </div>

        <!-- Tabla de datos -->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Area</th>
                    <th scope="col">Categoria</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">Activo</th>
                </tr>
            </thead>
            <tbody id="articulos-tbody">
            </tbody>
        </table>
    </div>

    <!-- Modal para crear/editar articulo -->
    <div id="createModal" class="modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createModalTitle">Crear Artículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="articulo-form" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="descripcion" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="form-select" id="categoria" required>
                                <option value="" disabled selected>Selecciona una categoría</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="area" class="form-label">Área</label>
                            <select class="form-select" id="area" required>
                                <option value="" disabled selected>Selecciona un área</option>
                            </select>
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input" id="flexCheckChecked" checked>
                            <label class="form-check-label" for="flexCheckChecked">Activa</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" form="articulo-form">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/src/components/navbar/navbar.js" defer></script>
    <script type="module" src="/src/pages/empleadoSistemas/empleadoSistemas.js" defer></script>
    <script type="module" src="/src/pages/empleadoSistemas/articulos/articulos.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
