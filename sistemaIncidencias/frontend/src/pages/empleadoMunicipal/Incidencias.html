<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Incidencias</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- NAV -->
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <!-- ESTILOS -->
    <link
      rel="stylesheet"
      href="../../styles/empleadoMunicipal/Incidencias.css"
    />
    <link
      rel="stylesheet"
      href="../../components/nueva_incidencia/NuevaIncidencia.css"
    />
    <!-- SCRIPTS -->
    <script src="Incidencias.js" defer></script>
  </head>
  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>
    <main>
      <h1>Mis Incidencias</h1>
      <article>
        <form class="d-flex" role="search">
          <h3>Filtros de busqueda</h3>
          <div class="filtro-palabra">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
          </div>
          <div
            class="btn-group"
            role="group"
            aria-label="Button group with nested dropdown"
          >
            <button type="button" class="btn btn-primary">Articulo</button>
            <button type="button" class="btn btn-primary">Fecha</button>

            <div class="btn-group" role="group">
              <button
                type="button"
                class="btn btn-primary dropdown-toggle"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Estados
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Pendientes</a></li>
                <li><a class="dropdown-item" href="#">En Proceso</a></li>
                <li><a class="dropdown-item" href="#">Finalizadas</a></li>
              </ul>
            </div>
          </div>
        </form>
      </article>
      <article class="table-responsive">
        <!-- Button trigger modal -->
        <button
          type="button"
          class="btn btn-danger"
          data-bs-toggle="modal"
          data-bs-target="#exampleModal"
        >
          CREAR NUEVA INCIDENCIA
        </button>
        <table class="table table-bordered table-striped">
          <thead class="table-info">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">ARTICULO</th>
              <th scope="col">ESTADO</th>
              <th scope="col">ASIGNADO</th>
              <th scope="col">FECHA</th>
              <th scope="col">PRIORIDAD</th>
              <th scope="col">PEDIDO</th>
              <th scope="col">SOLUCION</th>
              <th scope="col">ACCION</th>
            </tr>
          </thead>
          <tbody id="bodyTable">
            <!-- CONTENIDO -->
          </tbody>
        </table>
      </article>
      <!-- Modal -->
      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">
                Formulario de Incidencia
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="container text-center">
                <div class="row div-buscador">
                  <div class="col">
                    <span>ID del Articulo</span>
                  </div>
                  <div class="col">
                    <input
                      id="articuloInput"
                      class="form-control"
                      type="number"
                    />
                  </div>
                  <div class="col">
                    <button
                      id="buscarArticulo"
                      class="btn btn-primary"
                      type="button"
                    >
                      Buscar
                    </button>
                  </div>
                </div>
                <div class="row" id="div-articulo" hidden>
                  <!-- DATOS DEL ARTICULO A REPORTAR -->
                </div>
                <div class="row div-pedido">
                  <div class="col">
                    <span>Descripcion del pedido</span>
                    <textarea
                      id="pedidoInput"
                      class="form-control"
                      maxlength="250"
                      placeholder="Escribe hasta 250 caracteres"
                      disabled
                    ></textarea>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button
                  id="botonReportar"
                  type="button"
                  class="btn btn-success"
                  disabled
                >
                  Continuar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
