<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Incidencias</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- NAV -->
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <!-- ESTILOS -->
    <link
      rel="stylesheet"
      href="../../styles/empleadoMunicipal/Incidencias.css"
    />
  </head>
  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>
    <main>
      <h1>Mis Incidencias</h1>
      <form class="d-flex" role="search">
        <input
          class="form-control me-2"
          type="search"
          placeholder="Search"
          aria-label="Search"
        />
        <select class="form-select" aria-label="Default select example">
          <option selected>Filtro</option>
          <option value="1">ID</option>
          <option value="2">Articulo</option>
          <option value="3">Estado</option>
          <option value="4">Fecha</option>
          <option value="5">Prioridad</option>
        </select>
        <button class="btn btn-outline-success" type="submit">BUSCAR</button>
      </form>
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">ARTICULO</th>
              <th scope="col">ESTADO</th>
              <th scope="col">ASIGNADO A</th>
              <th scope="col">FECHA</th>
              <th scope="col">PRIORIDAD</th>
              <th scope="col">PEDIDO</th>
              <th scope="col">SOLUCION</th>
            </tr>
          </thead>
          <tbody>
            <!-- CONTENIDO -->
          </tbody>
        </table>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
