<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Incidencias</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <!-- NAV -->
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <!-- ESTILOS -->
    <link
      rel="stylesheet"
      href="../../../styles/empleadoMunicipal/Incidencias.css"
    />
    <link rel="stylesheet" href="../../../styles/empleadoMunicipal/Nav.css" />
    <!-- SCRIPTS -->
    <script src="Incidencias.js" defer></script>
  </head>
  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>
    <main>
      <article class="nav">
        <a href="../Inicio/Inicio.html" class="btn btn-outline-dark">INICIO</a>
        <a href="../Articulos/Articulos.html" class="btn btn-outline-dark"
          >ARTICULOS</a
        >
        <a href="../Perfil/Perfil.html" class="btn btn-outline-dark">PERFIL</a>
      </article>
      <article class="filtros">
        <span>FILTRO</span>
        <input class="form-control me-2" type="search" />
        <button class="btn btn-primary" type="submit">BUSCAR</button>
      </article>
      <article class="tabla">
        <div class="d-flex justify-content-between align-items-center">
          <h3>Mis Incidencias</h3>
          <button type="button" class="btn btn-danger" id="btnReportar">
            REPORTAR
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered table-striped border-dark">
            <thead class="table-info">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">ARTICULO</th>
                <th scope="col">ESTADO</th>
                <th scope="col">ASIGNADO</th>
                <th scope="col">FECHA</th>
                <th scope="col">PRIORIDAD</th>
                <th scope="col">PEDIDO</th>
                <th scope="col">SOLUCION</th>
                <th scope="col">ACCION</th>
              </tr>
            </thead>
            <tbody id="bodyTable">
              <!-- CONTENIDO -->
            </tbody>
          </table>
        </div>
      </article>
      <!-- MODAL -->
      <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">
                Formulario de Incidencia
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="container text-center">
                <div id="div-articulo">
                  <span>Articulo:</span>
                  <select id="articuloInput" class="form-select">
                    <!-- LISTA DE ARTICULOS -->
                    <option selected disabled>Cargando...</option>
                  </select>
                  <button
                    id="buscarArticulo"
                    class="btn btn-primary"
                    type="button"
                  >
                    Buscar
                  </button>
                </div>
                <div id="div-pedido">
                  <span>Descripcion del pedido</span>
                  <textarea
                    id="pedidoInput"
                    class="form-control"
                    maxlength="250"
                    placeholder="Escribe hasta 250 caracteres."
                  ></textarea>
                </div>
                <div id="div-incidencia" class="alert alert-warning" hidden>
                  <!-- INFO DE INCIDENCIA -->
                </div>
              </div>
              <div class="modal-footer">
                <button
                  id="btnReiniciar"
                  type="button"
                  class="btn btn-secondary"
                >
                  Reiniciar
                </button>
                <button id="btnContinuar" type="button" class="btn btn-success">
                  Continuar
                </button>
                <button
                  id="btnVolver"
                  type="button"
                  class="btn btn-secondary"
                  hidden
                >
                  Volver
                </button>
                <button
                  id="btnConfirmar"
                  type="button"
                  class="btn btn-success"
                  hidden
                >
                  Confirmar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
