<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <link rel="stylesheet" href="../../styles/empleadoMunicipal/Inicio.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg custom-navbar" data-bs-theme="dark">
        <div class="container-fluid">
          <img
            class="logo"
            src="/src/assets/logoMunicipalidad.png"
            alt="Logo Municipalidad"
          />
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="#">INICIO</a>
              <a class="nav-link" href="#">ARTICULOS</a>
              <a class="nav-link" href="#">INCIDENCIAS</a>
            </div>
          </div>
          <!-- Perfil de usuario: reemplaza al navbar-toggler de Bootstrap -->
          <div
            class="user-profile-toggle"
            role="button"
            tabindex="0"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Abrir menú / perfil"
          >
            <div class="user-info">
              <span class="user-name">Nombre Apellido</span>
              <span class="user-role">Rol del usuario</span>
            </div>
            <div class="user-avatar"></div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <article class="cuadros">
        <div class="cuadro">
          <span>000</span>
          <span>PENDIENTES</span>
        </div>
        <div class="cuadro">
          <span>000</span>
          <span>EN PROCESO</span>
        </div>
        <div class="cuadro">
          <span>000</span>
          <span>FINALIZADAS</span>
        </div>
      </article>
      <article class="tabla">
        <label>ULTIMAS INCIDENCIAS EN EL AREA</label>
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">ARTICULO</th>
                <th scope="col">ESTADO</th>
                <th scope="col">CREADO POR</th>
                <th scope="col">ASIGNADO A</th>
                <th scope="col">FECHA</th>
                <th scope="col">PRIORIDAD</th>
                <th scope="col">PEDIDO</th>
                <th scope="col">SOLUCION</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
                <td>9</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>
    </main>
    <footer></footer>
  </body>
</html>
