<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- NAV -->
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <!-- ESTILOS -->
    <link rel="stylesheet" href="../../styles/empleadoMunicipal/Inicio.css" />
    <!-- SCRIPTS -->
    <script src="Inicio.js" defer></script>
  </head>
  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>
    <main>
      <h1>¡Bienvenido, {USUARIO}!</h1>
      <article class="incidencias">
        <h3>Panel de Incidencias</h3>
        <div class="contenedor-alertas">
          <div
            id="cuadro_pendientes"
            class="alert alert-primary"
            role="alert"
          ></div>
          <div
            id="cuadro_en_proceso"
            class="alert alert-warning"
            role="alert"
          ></div>
        </div>
      </article>
      <article class="table-responsive">
        <h2>Mis Ultimas Incidencias</h2>
        <table class="table table-bordered table-striped">
          <thead class="table-info">
            <tr>
              <th scope="col">ID</th>
              <th scope="col">ARTICULO</th>
              <th scope="col">ESTADO</th>
              <th scope="col">ASIGNADO</th>
              <th scope="col">FECHA</th>
              <th scope="col">PRIORIDAD</th>
              <th scope="col">PEDIDO</th>
              <th scope="col">SOLUCION</th>
            </tr>
          </thead>
          <tbody id="bodyTable">
            <!-- CONTENIDO -->
          </tbody>
        </table>
      </article>
    </main>
    <footer></footer>
  </body>
</html>
