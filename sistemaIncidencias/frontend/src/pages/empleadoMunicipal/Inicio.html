<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- NAV -->
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <!-- ESTILOS -->
    <link
      rel="stylesheet"
      href="../../styles/empleadoMunicipal/Inicio.css"
    />
    <!-- SCRIPTS -->
     <script src="Incidencias.js" defer></script>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg custom-navbar" data-bs-theme="dark">
        <div class="container-fluid">
          <img
            class="logo"
            src="/src/assets/logoMunicipalidad.png"
            alt="Logo Municipalidad"
          />
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="#">INICIO</a>
              <a class="nav-link" href="#">ARTICULOS</a>
              <a class="nav-link" href="#">INCIDENCIAS</a>
            </div>
          </div>
          <!-- Perfil de usuario: reemplaza al navbar-toggler de Bootstrap -->
          <div
            class="user-profile-toggle"
            role="button"
            tabindex="0"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Abrir menú / perfil"
          >
            <div class="user-info">
              <span class="user-name">Nombre Apellido</span>
              <span class="user-role">Rol del usuario</span>
            </div>
            <div class="user-avatar"></div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <h1>BIENVENIDO, USUARIO</h1>
      <article class="incidencias">
        <h3>Panel de Incidencias</h3>
        <div class="contenedor-alertas">
          <div class="alert alert-primary" role="alert">0000 PENDIENTES</div>
          <div class="alert alert-warning" role="alert">0000 EN PROCESO</div>
          <div class="alert alert-success" role="alert">0000 FINALIZADAS</div>
        </div>
      </article>
      <article class="tabla">
        <h2>Ultimas Incidencias</h2>
        <div class="table-responsive">
          <table class="table table-bordered table-striped">
            <thead class="table-info">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">ARTICULO</th>
                <th scope="col">ESTADO</th>
                <th scope="col">ASIGNADO</th>
                <th scope="col">FECHA</th>
                <th scope="col">PRIORIDAD</th>
                <th scope="col">PEDIDO</th>
                <th scope="col">SOLUCION</th>
              </tr>
            </thead>
            <tbody id="bodyTable">
              <!-- CONTENIDO -->
            </tbody>
          </table>
        </div>
      </article>
    </main>
    <footer></footer>
  </body>
</html>
