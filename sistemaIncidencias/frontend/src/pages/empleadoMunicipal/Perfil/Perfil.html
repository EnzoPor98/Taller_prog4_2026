<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- NAV -->
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <!-- ESTILOS -->
    <link
      rel="stylesheet"
      href="../../../styles/empleadoMunicipal/Perfil.css"
    />
    <link rel="stylesheet" href="../../../styles/empleadoMunicipal/Nav.css" />
    <!-- SCRIPTS -->
    <script src="Perfil.js" defer></script>
  </head>
  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>
    <main>
      <article class="nav">
        <a href="../Inicio/Inicio.html" class="btn btn-outline-dark">INICIO</a>
        <a href="../Articulos/Articulos.html" class="btn btn-outline-dark"
          >ARTICULOS</a
        >
        <a href="../Incidencias/Incidencias.html" class="btn btn-outline-dark"
          >INCIDENCIAS</a
        >
      </article>
      <article class="formulario">
        <h1>Perfil de Usuario</h1>
        <form id="formulario">
          <h3>Datos de Usuario</h3>
          <div class="info">
            <label for="identificador"># ID:</label>
            <input
              id="identificador"
              class="form-control"
              type="text"
              disabled
              readonly
            />
          </div>
          <div class="info">
            <label for="nombres">Nombres:</label>
            <input id="nombres" class="form-control" type="text" />
          </div>
          <div class="info">
            <label for="apellidos">Apellidos:</label>
            <input id="apellidos" class="form-control" type="text" />
          </div>
          <div class="info">
            <label for="area">Area:</label>
            <input
              id="area"
              class="form-control"
              type="text"
              disabled
              readonly
            />
          </div>
          <div class="info">
            <label for="rol">Rol:</label>
            <input
              id="rol"
              class="form-control"
              type="text"
              disabled
              readonly
            />
          </div>
          <h3>Datos de Cuenta</h3>
          <div class="info">
            <label for="usuario">Usuario:</label>
            <input id="usuario" class="form-control" type="email" />
          </div>
          <div class="info">
            <label for="contrasenia_actual">Contraseña actual:</label>
            <input
              id="contrasenia_actual"
              class="form-control"
              type="password"
            />
          </div>
          <div class="info">
            <label for="contrasenia_nueva">Nueva Contraseña:</label>
            <input
              id="contrasenia_nueva"
              class="form-control"
              type="password"
            />
          </div>
          <div class="info">
            <label for="confirmar">Confirmar Contraseña:</label>
            <input id="confirmar" class="form-control" type="password" />
          </div>
          <button class="btn btn-success" type="submit">GUARDAR CAMBIOS</button>
        </form>
      </article>
    </main>
    <footer></footer>
  </body>
</html>
