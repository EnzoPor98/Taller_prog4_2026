<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- NAV -->
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <!-- ESTILOS -->
    <link rel="stylesheet" href="../../styles/empleadoMunicipal/Perfil.css" />
    <!-- SCRIPTS -->
    <script src="Perfil.js" defer></script>
  </head>
  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>
    <main>
      <h1>Perfil de Usuario</h1>
      <form id="formulario" action="" method="post">
        <h2>Datos de Usuario</h2>
        <div class="info">
          <label for="identificador"># ID:</label>
          <input
            id="identificador"
            class="form-control"
            type="text"
            aria-label="Disabled input example"
            disabled
            readonly
          />
        </div>
        <div class="info">
          <label for="nombres">Nombres:</label>
          <input
            id="nombres"
            class="form-control"
            type="text"
            aria-label="default input example"
          />
        </div>
        <div class="info">
          <label for="apellidos">Apellidos:</label>
          <input
            id="apellidos"
            class="form-control"
            type="text"
            aria-label="default input example"
          />
        </div>
        <div class="info">
          <label for="area">Area:</label>
          <input
            id="area"
            class="form-control"
            type="text"
            aria-label="Disabled input example"
            disabled
            readonly
          />
        </div>
        <div class="info">
          <label for="rol">Rol:</label>
          <input
            id="rol"
            class="form-control"
            type="text"
            aria-label="Disabled input example"
            disabled
            readonly
          />
        </div>
        <div class="user">
          <h2>Datos de Cuenta</h2>
          <div class="info">
            <label for="usuario">Usuario:</label>
            <input
              id="usuario"
              class="form-control"
              type="email"
              aria-label="default input example"
            />
          </div>
          <div class="info">
            <label for="contrasenia_actual">Contraseña actual:</label>
            <input
              id="contrasenia_actual"
              class="form-control"
              type="password"
              aria-label="default input example"
            />
          </div>
          <div class="info">
            <label for="contrasenia_nueva">Nueva Contraseña:</label>
            <input
              id="contrasenia_nueva"
              class="form-control"
              type="password"
              aria-label="default input example"
            />
          </div>
          <div class="info">
            <label for="confirmar">Confirmar Contraseña:</label>
            <input
              id="confirmar"
              class="form-control"
              type="password"
              aria-label="default input example"
            />
          </div>
        </div>
        <button class="btn btn-success" type="submit">Guardar Cambios</button>
      </form>
    </main>
    <footer></footer>
  </body>
</html>
