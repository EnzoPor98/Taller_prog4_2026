<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- NAV -->
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <!-- ESTILOS -->
    <link
      rel="stylesheet"
      href="../../../styles/empleadoMunicipal/Inicio.css"
    />
    <link rel="stylesheet" href="../../../styles/empleadoMunicipal/Nav.css" />
    <!-- SCRIPTS -->
    <script src="Inicio.js" defer></script>
  </head>
  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>
    <main>
      <article class="nav">
        <a href="../Articulos/Articulos.html" class="btn btn-outline-dark"
          >ARTICULOS</a
        >
        <a href="../Incidencias/Incidencias.html" class="btn btn-outline-dark"
          >INCIDENCIAS</a
        >
        <a href="../Perfil/Perfil.html" class="btn btn-outline-dark">PERFIL</a>
      </article>
      <article class="incidencias">
        <h1>Panel de Incidencias</h1>
        <div class="contenedor-alertas">
          <div
            id="cuadro_pendientes"
            class="alert alert-primary"
            role="alert"
          ></div>
          <div
            id="cuadro_en_proceso"
            class="alert alert-warning"
            role="alert"
          ></div>
        </div>
      </article>
      <article class="tabla">
        <h2>Mis Ultimas Incidencias</h2>
        <div class="table-responsive">
          <table class="table table-bordered table-striped border-dark">
            <thead class="table-info">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">ARTICULO</th>
                <th scope="col">ESTADO</th>
                <th scope="col">ASIGNADO</th>
                <th scope="col">FECHA</th>
                <th scope="col">PRIORIDAD</th>
                <th scope="col">PEDIDO</th>
                <th scope="col">SOLUCION</th>
              </tr>
            </thead>
            <tbody id="bodyTable">
              <!-- CONTENIDO -->
            </tbody>
          </table>
        </div>
      </article>
    </main>
    <footer></footer>
  </body>
</html>
