<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva Incidencia</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- NAV -->
    <link rel="stylesheet" href="/src/components/navbar/navbar.css" />
    <script src="/src/components/navbar/navbar.js" defer></script>
    <!-- ESTILOS -->
    <link
      rel="stylesheet"
      href="../../styles/empleadoMunicipal/NuevaIncidencia.css"
    />
  </head>
  <body>
    <header>
      <div id="navbar-placeholder"></div>
    </header>
    <main>
      <h1>Formulario de Incidencia</h1>
      <article>
        <p>
          Primero identifique el articulo y luego se habilitara la descripcion
          de la incidencia para reportarla.
        </p>
        <form id="articulo" action="" method="POST">
          <span>ID articulo</span>
          <input type="number" />
          <button type="submit" class="btn btn-success">BUSCAR</button>
          <div class="alert alert-success" role="alert" hidden="true">
            ARTICULO ENCONTRADO/ NO ENCONTRADO
          </div>
        </form>
        <form id="incidencia" action="" method="POST">
          <span>Descripcion del pedido</span>
          <textarea maxlength="250" disabled="true"></textarea>
          <button type="submit" class="btn btn-success" disabled="true">
            REPORTAR
          </button>
        </form>
      </article>
    </main>
    <footer></footer>
  </body>
</html>
