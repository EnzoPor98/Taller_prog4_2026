<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <link rel="stylesheet" href="./src/styles/index.css" />
  </head>
  <body>
    <header>
      <img src="./src/assets/logoMunicipalidad.png" alt="Logo Municipalidad" />
    </header>
    <main>
      <article>
        <h1>Bienvenido al Sistema de Incidencias</h1>
        <p>
          Este sistema permite gestionar y reportar incidencias de manera eficiente.
        </p>
      </article>
      <form action="#" method="post">
        <p>Para comenzar, por favor inicie sesión.</p>
        <div>
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">INICIAR SESIÓN</button>
      </form>
    </main>
    <footer>
      <h6>© 2024 Sistema de Incidencias. Todos los derechos reservados.</h6>
    </footer>
  </body>
</html>
