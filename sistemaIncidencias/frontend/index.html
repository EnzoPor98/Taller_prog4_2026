<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio</title>
  <link rel="stylesheet" href="./src/styles/index.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>

<body>
  <header>
    <img src="./src/assets/logoMunicipalidad.png" alt="Logo Municipalidad" />
  </header>
  <main>
    <article>
      <h1>Bienvenido al Sistema de Incidencias</h1>
      <p>
        Este sistema permite gestionar y reportar incidencias de manera eficiente.
      </p>
    </article>
    <div class="card text-center">
      <div class="card-body">
        <h5 class="card-title">Para comenzar, por favor inicie sesión</h5>
        <form id="loginForm" action="#" method="post">
          <div>
            <label for="email" class="form-label">Email</label>
            <input type="text" id="email" name="email" class="form-control" required />
          </div>
          <div>
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required />
          </div>
          <button type="submit" class="mt-3 btn btn-primary">Iniciar Sesión</button>
        </form>
      </div>
      <p>Si aun no tenes cuenta, <a href="/src/pages/registro/registro.html">regístrate aquí</a>.</p>
    </div>
  </main>
  <footer>
    <h6>© 2024 Sistema de Incidencias. Todos los derechos reservados.</h6>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      if (!email || !password) {
        alert("Por favor, complete todos los campos.");
        return;
      }
      const emailGuardado = localStorage.getItem("email"); //Unica sesion de usuario, por lo que se guarda en localStorage
      const passwordGuardado = localStorage.getItem("password");


      if (email === emailGuardado && password === passwordGuardado) {
        alert("Inicio de sesión exitoso.");
        switch (localStorage.getItem("rol")) {
          case "sistemas":
            window.location.href = "/src/pages/empleadoSistemas/empleadoSistemas.html";
            break;
          case "municipal":
            window.location.href = "/src/pages/empleadoMunicipal/empleadoMunicipal.html";
            break;
          case "director":
            window.location.href = "/src/pages/director/director.html";
            break;
          default:
            alert("Rol no reconocido.");
        }
      } else {
        alert("Email o contraseña incorrectos.");
      }
    });
  </script>
</body>

</html>
