<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/components/navbar/navbar.css" />
    <link rel="stylesheet" href="./src/styles/index.css" />
  </head>

  <body>
    <header>
      <nav class="custom-navbar">
        <img
          class="logo"
          src="./src/assets/logoMunicipalidad.png"
          alt="Logo Municipalidad"
        />
      </nav>
    </header>
    <main>
      <h1 class="titulo">¡BIENVENIDO!</h1>
      <form id="loginForm" method="POST" action="/login">
        <p>Por favor, inicie sesión para continuar.</p>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label"
            >Correo Electrónico</label
          >
          <input
            type="email"
            class="form-control"
            id="exampleInputEmail1"
            aria-describedby="emailHelp"
          />
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label"
            >Contraseña</label
          >
          <input
            type="password"
            class="form-control"
            id="exampleInputPassword1"
          />
        </div>
        <button type="submit" id="loginButton" class="btn btn-primary">
          INICIAR SESIÓN
        </button>
      </form>
    </main>
    <footer></footer>
    <script>
      const form = document.getElementById("loginForm");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        console.log("pepe");
        window.location.href =
          "/src/pages/directorSistemas/directorSistemas.html";
      });
    </script>
  </body>
</html>
