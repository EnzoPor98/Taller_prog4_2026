<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio</title>
  <link rel="stylesheet" href="./src/components/navbar/navbar.css" />
  <link rel="stylesheet" href="./src/styles/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>

<body>

  <header>
    <img src="./src/assets/logoMunicipalidad.png" alt="Logo Municipalidad" />
  </header>
  <main>
    <article>
      <h1>Bienvenido al Sistema de Incidencias</h1>
      <p>
        Este sistema permite gestionar y reportar incidencias de manera eficiente.
      </p>
    </article>
    <div class="card text-center">
      <div class="card-body">
        <h5 class="card-title">Para comenzar, por favor inicie sesión</h5>
        <form id="loginForm" action="#" method="post">
          <div>
            <label for="email" class="form-label">Email</label>
            <input type="text" id="email" name="email" class="form-control" required />
          </div>
          <div>
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" required />
          </div>
          <button type="submit" class="mt-3 btn btn-primary">Iniciar Sesión</button>
        </form>
      </div>
      <p>Si aun no tenes cuenta, <a href="/src/pages/registro/registro.html">regístrate aquí</a>.</p>
    </div>


  </main>
  <footer>
    <h6>© 2024 Sistema de Incidencias. Todos los derechos reservados.</h6>
  </footer>
  <script type="module" src="./src/main.js"></script>
  <script>



    const API_URL = "http://localhost:3000"; // ajustar puerto/host del backend si es distinto

    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Por favor, complete todos los campos.");
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario: email, contrasenia: password })
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.mensaje || "Email o contraseña incorrectos.");
          return;
        }

        // Guardamos el token y los datos del usuario para usarlos en otras páginas
        localStorage.setItem("token", data.token);
        localStorage.setItem("usuario", JSON.stringify(data.usuario));


        switch (data.usuario.rol) {
          case 3:
            window.location.href = "/src/pages/empleadoSistemas/empleadoSistemas.html";
            break;
          case 2:
            window.location.href = "/src/pages/empleadoMunicipal/empleadoMunicipal.html";
            break;
          case 1:
            window.location.href = "/src/pages/director/director.html";
            break;
          default:
            alert("Rol no reconocido.");
        }
      } catch (error) {
        console.log("🚀 ~ login ~ error:", error);
        alert("No se pudo conectar con el servidor.");
      }
    });
  </script>

</body>

</html>
